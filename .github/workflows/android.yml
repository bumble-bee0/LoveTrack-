name: Android CI Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ekstrak zip project (kalau ada)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan file zip: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "Tidak ada zip, lanjut struktur folder biasa."
          fi

      - name: Deteksi lokasi folder project Android
        id: findproject
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 2 -name "settings.gradle.kts" 2>/dev/null -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: ${{ steps.findproject.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.findproject.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
